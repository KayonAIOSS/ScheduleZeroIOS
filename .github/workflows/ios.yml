# Builds the iPhone app on a GitHub macOS runner (there is no Mac at home).
#  - Runs the unit tests on an iPhone simulator, including a full sync test against the real
#    Python server started on the runner.
#  - Takes simulator screenshots of every screen (demo data, no network) so the look can be
#    checked from Windows.
#  - Produces an UNSIGNED ScheduleZero.ipa. SideStore / AltStore sign it with each person's
#    free Apple ID when it's installed.
# Pushing a tag like v1.0.3 also publishes the .ipa as a GitHub Release.
name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(python3 ci/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Start the sync server for the integration test
        working-directory: server
        run: |
          python3 schedulezero_server.py --port 18787 --data "$RUNNER_TEMP/szdata" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18787/api/ping && break; sleep 0.5; done

      - name: Unit tests
        env:
          TEST_RUNNER_SZ_TEST_SERVER: http://127.0.0.1:18787
        run: |
          set -o pipefail
          xcodebuild test -project ScheduleZero.xcodeproj -scheme ScheduleZero \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log" | xcbeautify --renderer github-actions || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/test.log"

      - name: Screenshots
        run: sh ci/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim "$RUNNER_TEMP/screenshots"

      - name: Build unsigned .ipa
        run: |
          set -o pipefail
          xcodebuild build -project ScheduleZero.xcodeproj -scheme ScheduleZero \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1             | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/ScheduleZero.app Payload/
          zip -qry "$RUNNER_TEMP/ScheduleZero.ipa" Payload
          ls -la "$RUNNER_TEMP/ScheduleZero.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ScheduleZero-ipa
          path: ${{ runner.temp }}/ScheduleZero.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/server.log

      # Artifacts need a GitHub sign-in to download, even on a public repo. This branch doesn't, so
      # screenshots and error logs can be checked from anywhere (raw.githubusercontent.com).
      - name: Publish screenshots and logs to the ci-output branch
        if: always() && github.event_name == 'push'
        run: |
          OUT="$RUNNER_TEMP/ci-output"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -R "$RUNNER_TEMP/screenshots" "$OUT/" 2>/dev/null || true
          for f in test build; do
            [ -f "$RUNNER_TEMP/$f.log" ] || continue
            grep -E "error:|warning:.*(deprecated|never used|unreachable)|Test Case .* failed|XCTAssert|\*\* (TEST|BUILD)" "$RUNNER_TEMP/$f.log" | head -300 > "$OUT/$f-errors.log" || true
            tail -n 300 "$RUNNER_TEMP/$f.log" > "$OUT/$f-tail.log"
          done
          cp "$RUNNER_TEMP/server.log" "$OUT/" 2>/dev/null || true
          echo "$GITHUB_SHA ${{ job.status }}" > "$OUT/commit.txt"
          cd "$OUT"
          git init -q -b ci-output
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q --allow-empty -m "CI output for $GITHUB_SHA"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q --amend -m "CI output for $GITHUB_SHA ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP/ScheduleZero.ipa" --title "ScheduleZero ${GITHUB_REF_NAME}" --notes "Install or update with SideStore / AltStore. See INSTALL.md."
