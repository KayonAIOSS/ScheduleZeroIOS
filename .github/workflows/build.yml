name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ci-output branch
  packages: write   # ghcr.io image

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Server tests
        run: python3 server/test_server.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit tests (native)
        working-directory: app
        run: cargo test 2>&1 | tee ../cargo-test.log

      - name: Build web app
        working-directory: app
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          trunk --version
          trunk build --release --public-url /ScheduleZero/ 2>&1 | tee ../trunk.log
          ls -la dist

      - name: Screenshots (iPhone WebKit + desktop Chromium)
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps webkit chromium > /dev/null
          python3 ci/screenshots.py app/dist shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: app/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - name: Publish screenshots and logs to the ci-output branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p out && cp -r shots out/ 2>/dev/null || true
          cp cargo-test.log trunk.log out/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/RESULT.txt
          cd out
          git init -q -b ci-output
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "CI output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Container image
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io/kayonaioss/schedulezeroweb
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kayonaioss/schedulezeroweb:latest
            ghcr.io/kayonaioss/schedulezeroweb:${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
